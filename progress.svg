<svg width="400" height="60" viewBox="0 0 400 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .track {
      fill: #e1e4e8;
    }
    .fill {
      fill: url(#grad);
      animation: load 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      width: 0px;
    }
    .text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #24292e;
      opacity: 0;
      animation: fadeIn 0.5s ease-out 1s forwards;
    }
    @keyframes load {
      to { width: 32.0px; }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @media (prefers-color-scheme: dark) {
      .track {
        fill: #21262d;
        stroke: #30363d;
      }
      .text {
        fill: #c9d1d9;
      }
    }
  </style>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
  </defs>
  
  <text x="0" y="18" class="text" style="animation: fadeIn 0.5s ease-out forwards; opacity: 1;">Roadmap Completion</text>
  <text x="360" y="18" class="text">8.0%</text>

  <rect x="0" y="30" width="400" height="16" rx="8" class="track" />
  <rect x="0" y="30" height="16" rx="8" class="fill" />
</svg>
